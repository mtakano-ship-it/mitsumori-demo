<script>

const QUOTES={

 {id:"P16",name:"仮設足場 外部 枠組",unit:"㎡",price:2100,page:105}];

 {id:"H1",name:"断熱扉 片開き W1200×H2100",price:552000,job:"2025年 K食品 第2工場 改修",satei:"指摘なし"},

 {id:"H3",name:"断熱パネル 壁 厚100mm",price:11200,job:"2025年 K食品 第2工場 改修",satei:"指摘なし"},
 {id:"H4",name:"分電盤 改造",price:420000,job:"2024年 T物流 倉庫改修",satei:"「内訳の提出を」と指摘"}];
const GOLD={ashiba:"P15",wall:"P02",ceil:"P03",floor:"P05",grating:"P08",led:"P11",cv:"P13",yojo:null,door:null,grease:null,panel:null};
const RATE0={"仮設":10,"内装":15,"床":12,"建具":15,"排水設備":12,"電気":10};

/* ===== 検索（言葉＋規格の条件） ===== */
function norm(s){
  s=s.normalize("NFKC").replace(/[()（）]/g," ");
  const R=[[/サンドイッチ/g,""],[/ステンレス/g,"SUS"],[/グリース阻集器|グリストラップ/g,"グリーストラップ"],[/防塵塗床|エポキシ塗床/g,"塗床 エポキシ"],
   [/エポキシ樹脂/g,"エポキシ"],[/厚膜型/g,"厚膜"],[/ドア/g,"扉"],[/防湿・防雨形|防湿形/g,"防湿"],[/LED照明器具/g,"LED照明"],[/内部足場/g,"足場 内部"],[/仮設足場/g,"足場"],
   [/壁パネル/g,"パネル 壁"],[/天井パネル/g,"パネル 天井"],[/断熱パネル壁/g,"断熱パネル 壁"],[/断熱パネル天井/g,"断熱パネル 天井"],[/器具/g,""]];
  for(const [a,b] of R) s=s.replace(a,b);
  return s.replace(/\s+/g," ").trim();
}
function attrs(raw){
  const s=norm(raw), a={};
  let m=s.match(/(?:\bt|厚)\s*(\d+(?:\.\d+)?)/)||s.match(/(\d+(?:\.\d+)?)\s*mm/); if(m) a["厚さ"]=parseFloat(m[1]);
  m=s.match(/(?:W|溝幅)\s*(\d{3})(?!\s*[×xH])/); if(m && !/×|H\d/.test(s)) a["溝幅"]=+m[1];
  if(/グレーチング/.test(s) && !a["溝幅"]){m=s.match(/\b(\d{3})\b/); if(m) a["溝幅"]=+m[1];}
  if(/SUS/.test(s)) a["材質"]="SUS"; else if(/鋼製/.test(s)) a["材質"]="鋼製";
  if(/壁/.test(s)) a["部位"]="壁"; else if(/天井/.test(s)) a["部位"]="天井";
  m=s.match(/(\d+(?:\.\d+)?)\s*sq/); if(m) a["太さ"]=parseFloat(m[1]);
  m=s.match(/(\d)\s*心|-(\d)C/); if(m) a["心数"]=+(m[1]||m[2]);
  if(/防湿/.test(s)) a["種別"]="防湿"; else if(/一般形/.test(s)) a["種別"]="一般";
  if(/内部/.test(s)) a["場所"]="内部"; else if(/外部/.test(s)) a["場所"]="外部";
  if(/厚膜/.test(s)) a["膜"]="厚膜"; else if(/薄膜/.test(s)) a["膜"]="薄膜";
  if(/ウレタン/.test(s)) a["樹脂"]="ウレタン"; else if(/エポキシ/.test(s)) a["樹脂"]="エポキシ";
  return a;
}
function grams(s,noDigits){ s=norm(s).replace(/\s/g,""); if(noDigits) s=s.replace(/[0-9.]/g,"");
  const g=new Set(); for(let i=0;i<s.length-1;i++) g.add(s.slice(i,i+2)); return g; }
function dice(a,b){ if(!a.size||!b.size) return 0; let n=0; a.forEach(x=>{if(b.has(x))n++}); return 2*n/(a.size+b.size); }
const TH=0.32;
/* mode: "hybrid"（言葉＋規格の条件）／ "meaning"（数値を区別しにくい検索の再現） */
function search(text,mode,db){
  const qa=attrs(text), qg=grams(text,mode==="meaning");
  return db.map(c=>{
    const ca=attrs(c.name), sc=dice(qg,grams(c.name,mode==="meaning"));
    const conflicts=Object.keys(qa).filter(k=>k in ca && qa[k]!==ca[k]);
    return {c,score:sc,conflicts,excluded:mode==="hybrid"&&conflicts.length>0};
  }).sort((x,y)=>(x.excluded-y.excluded)||(y.score-x.score)||x.c.id.localeCompare(y.c.id));
}
function bestHit(text,mode,db){ const r=search(text,mode,db); const top=r.find(x=>!x.excluded); return (top&&top.score>=TH)?top:null; }

/* ===== 値入れのルール ===== */
const round=(v)=>v>=10000?Math.round(v/100)*100:Math.round(v/10)*10;
function priceLine(line,rate,cap){
  const kos=KOSHU_MAP[line.koshu]||line.koshu, r=(rate[kos]??10)/100;
  const hit=bestHit(line.name,"hybrid",BUKKA), past=bestHit(line.name,"hybrid",PAST);
  const out={line,kos,r,hit,past,proposal:null,state:"",basis:"",origin:null,note:""};
  if(line.price==null){out.state="対象外";out.basis="見積に含まれていません（別途工事）";return out;}
  const marked=round(line.price*(1+r));
  if(hit){
    const lim=round(hit.c.price*cap); out.origin={kind:"物価資料",value:hit.c.price,id:hit.c.id};
    out.basis=`${SRC} p.${hit.c.page}「${hit.c.name}」${hit.c.price.toLocaleString()}円`;
    if(line.price>lim){out.proposal=line.price;out.state="価格調整の候補";
      out.note=`業者見積が上限 ${lim.toLocaleString()}円 を超過。業者への価格調整の目安 ${round(lim/(1+r)).toLocaleString()}円`;}
    else if(marked>lim){out.proposal=lim;out.state="照合済み（上限を適用）";}
    else {out.proposal=marked;out.state="照合済み";}
  } else if(past){
    out.proposal=past.c.price;out.state="仮置き・要確認";out.origin={kind:"過去の提出",value:past.c.price,id:past.c.id};
    out.basis=`過去の提出単価：${past.c.job}「${past.c.name}」${past.c.price.toLocaleString()}円`;
    if(past.c.satei!=="指摘なし") out.note=`前回の査定で${past.c.satei}`;
  } else {out.state="未算出";out.basis="物価資料・過去の提出に該当なし";}
  return out;
}

}

function v5(){
  const esc=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const line={key:"try",koshu:S.tryKoshu,name:S.tryName,qty:1,unit:"",price:S.tryPrice>0?S.tryPrice:null};
  const p=priceLine(line,S.rate,S.cap/100), qa=attrs(S.tryName);
  if(line.price==null){p.state="未算出";p.basis="業者見積の単価が未入力です";}
  const all=search(S.tryName,"hybrid",BUKKA), top=p.hit?p.hit.c.id:null;
  const ok=all.filter(x=>!x.excluded).slice(0,3), ng=all.filter(x=>x.excluded).sort((a,b)=>b.score-a.score).slice(0,3);
  const mean=search(S.tryName,"meaning",BUKKA)[0];
  const pr=search(S.tryName,"hybrid",PAST).filter(x=>x.score>=TH&&!x.excluded).slice(0,2);
  return `<div class="split"><div style="display:flex;flex-direction:column;gap:12px;min-width:0">
   <section class="panel"><div class="ph"><h2>⑥ 自由に試す</h2><p>見積書の1行を入力すると、物価資料（架空・${BUKKA.length}件）の検索と値入れの計算をその場で行います</p></div>
   <div class="rules" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <label style="grid-column:1/-1">名称・規格（見積書の表記のまま）<input type="text" id="t-name" value="${esc(S.tryName)}" style="font-family:var(--f-body)"></label>
    <label>工種<select id="t-koshu" style="font:700 14px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)">${Object.keys(RATE0).map(k=>`<option ${k===S.tryKoshu?"selected":""}>${k}</option>`).join("")}</select></label>
    <label>業者見積の単価（円）<input type="number" id="t-price" min="0" step="10" value="${S.tryPrice||""}"></label></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="t-run">検索して計算</button></div>
   <p class="note" style="margin:10px 0 4px;font-weight:700">入力の例（押すと入ります）</p>
   <div style="display:flex;gap:6px;flex-wrap:wrap">${EX.map((e,i)=>`<button class="btn ghost" data-ex="${i}" style="padding:6px 10px;font-size:12px">${esc(e[0])}</button>`).join("")}</div>
   <p class="note" style="margin:10px 0 0">上乗せ率 ${S.rate[S.tryKoshu]}%・上限 物価資料の${S.cap}%（③ 値入れの画面の設定を使います）</p></section>
   <section class="panel"><div class="ph"><h2>物価資料の一覧（架空）</h2><p>検索の対象です。${SRC}</p></div>
   <div class="tw"><table><tr><th>番号</th><th>名称・規格</th><th class="n">単価</th><th class="n">掲載ページ</th></tr>${BUKKA.map(c=>`<tr class="${c.id===top?"sel":""}"><td class="s">${c.id}</td><td>${c.name}</td><td class="n">${yen(c.price)}</td><td class="n">p.${c.page}</td></tr>`).join("")}</table></div></section></div>
   <aside class="panel drawer"><div class="ph" style="margin:0"><h2>検索の中身</h2><span class="chip c-ai">RAG</span></div>
    <div class="q"><b>入力した行（検索の元）</b>${esc(S.tryName)||"（未入力）"}<br><span class="note">読み取った規格：${Object.entries(qa).map(([k,v])=>k+"="+v).join("／")||"なし"}</span></div>
    <div class="note" style="font-weight:700">物価資料の候補（上位3件）</div>${ok.map(x=>candHtml(x,x.c.id===top)).join("")}
    ${top?"":'<div class="note">言葉の一致が基準（'+Math.round(TH*100)+'%）に届かないため、物価資料からは採用しません</div>'}
    ${ng.length?'<div class="note" style="font-weight:700">規格が合わずに外した候補</div>'+ng.map(x=>candHtml(x,false)).join(""):""}
    <div class="note" style="font-weight:700">過去の提出・査定</div>${pr.length?pr.map(x=>`<div class="cand"><div class="t"><span>${x.c.name}</span><span class="n">${yen(x.c.price)}</span></div><div class="m">${x.c.job}｜査定：${x.c.satei}</div></div>`).join(""):'<div class="note">該当なし</div>'}
    <div class="q"><b>提出単価案と根拠</b><span style="font:800 18px var(--f-num)">${yen(p.proposal)}</span> ${stChip(p)}<br>${p.basis}${p.note?`<br><span style="color:var(--warn);font-weight:700">${p.note}</span>`:""}</div>
    <div class="q"><b>比較：数値を区別しにくい検索の1位</b>${mean?mean.c.id+"　"+mean.c.name:"—"}${mean&&top&&mean.c.id!==top?'<br><span style="color:var(--warn);font-weight:700">規格を条件にした検索と結果が違います</span>':""}</div>
   </aside></div>`;
}
function render(){
  nav(); const V=[v0,v1,v2,v3,v4,v5][S.step]; document.getElementById("view").innerHTML=V();
  const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
  $$("input[name=pick]").forEach(i=>i.onchange=()=>{S.pick=i.value;S.sel=null});
  $("#go2")&&($("#go2").onclick=()=>{S.step=2;render()});
  $$("[data-row]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("input,label"))return;S.sel=tr.dataset.row;render()});
  $$("[data-ck]").forEach(c=>c.onchange=()=>{S.checks[c.dataset.ck]=c.checked;render()});
  $$("[data-man]").forEach(i=>i.onchange=()=>{const v=parseInt(i.value.replace(/[^0-9]/g,""),10);if(v>0){S.manual[i.dataset.man]=v;}else delete S.manual[i.dataset.man];S.checks[i.dataset.man]=false;render()});
  $$("[data-rate]").forEach(i=>i.onchange=()=>{const v=+i.value;if(v>=0&&v<=50){S.rate[i.dataset.rate]=v}render()});
  $("[data-cap]")&&($("[data-cap]").onchange=e=>{const v=+e.target.value;if(v>=80&&v<=120)S.cap=v;render()});

  if($("#t-run")){
    const run=()=>{S.tryName=$("#t-name").value.trim();S.tryKoshu=$("#t-koshu").value;S.tryPrice=parseInt($("#t-price").value,10)||0;render()};
    $("#t-run").onclick=run; $("#t-name").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)run()}; $("#t-price").onkeydown=e=>{if(e.key==="Enter")run()}; $("#t-koshu").onchange=run;
    $$("[data-ex]").forEach(b=>b.onclick=()=>{const e=EX[+b.dataset.ex];S.tryName=e[0];S.tryKoshu=e[1];S.tryPrice=e[2];render()});}
  $$("[data-goto]").forEach(b=>b.onclick=()=>{S.step=+b.dataset.goto;render()});
  $$("[data-mode]").forEach(b=>b.onclick=()=>{S.evalMode=b.dataset.mode;render()});
  $("#copy")&&($("#copy").onclick=()=>{const t=$("#csv").textContent;const done=m=>{$("#copied").textContent=m};
    try{navigator.clipboard.writeText(t).then(()=>done("コピーしました"),()=>{selectCsv();done("選択しました。⌘C でコピーしてください")})}catch(e){selectCsv();done("選択しました。⌘C でコピーしてください")}});
}
function selectCsv(){const r=document.createRange();r.selectNodeContents(document.getElementById("csv"));const s=getSelection();s.removeAllRanges();s.addRange(r);}
if(typeof window!=="undefined"&&document.getElementById("view")) render();
</script>
</body>
</html>
